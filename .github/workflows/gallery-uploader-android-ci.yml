# Build & test the Galleree Upload Android app (workflow artifacts only). No GitHub Release.
# Pushes to main/master are released by gallery-uploader-android-release.yml instead.
#
# PR/branch pushes: analyze + unit tests only (fast feedback).
# workflow_dispatch: also builds a release APK artifact for sideload testing.

name: Gallery uploader Android (Flutter)

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - 'tools/gallery-uploader-android/**'
      - '.github/workflows/gallery-uploader-android-ci.yml'
      - '.github/actions/setup-galleree-android/**'
  pull_request:
    paths:
      - 'tools/gallery-uploader-android/**'
      - '.github/workflows/gallery-uploader-android-ci.yml'
      - '.github/actions/setup-galleree-android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-uploader-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
  ORG_GRADLE_PROJECT_kotlin.incremental: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/gallery-uploader-android

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter and Gradle caches
        uses: ./.github/actions/setup-galleree-android

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --release

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: galleree-upload-android-apk
          path: tools/gallery-uploader-android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
