# Build & test the Galleree Upload Android app (workflow artifacts only). No GitHub Release.
# Pushes to main/master are released by gallery-uploader-android-release.yml instead.

name: Gallery uploader Android (Flutter)

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - 'tools/gallery-uploader-android/**'
      - '.github/workflows/gallery-uploader-android-ci.yml'
  pull_request:
    paths:
      - 'tools/gallery-uploader-android/**'
      - '.github/workflows/gallery-uploader-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-uploader-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/gallery-uploader-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: galleree-upload-android-apk
          path: tools/gallery-uploader-android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
